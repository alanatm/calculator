<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page">
    <h1 class="title">Simple Calculator</h1>
    <div class="calculator">
        <div id="result-number" class="calculator__display">0</div>
        <div class="calculator__keys">

            <button id="btn-delete" class="calculator__button">←</button>
            <button id="btn-clean" class="calculator__button">AC</button>
            <button id="btn-percentage" class="calculator__button">%</button>
            <button id="btn-division" class="calculator__button">/</button>
            <button data-value="7" class="calculator__button--number">7</button>
            <button data-value="8" class="calculator__button--number">8</button>
            <button data-value="9" class="calculator__button--number">9</button>
            <button id="btn-multi" class="calculator__button">*</button>
            <button data-value="4" class="calculator__button--number">4</button>
            <button data-value="5" class="calculator__button--number">5</button>
            <button data-value="6" class="calculator__button--number">6</button>
            <button id="btn-sub" class="calculator__button">-</button>
            <button data-value="1" class="calculator__button--number">1</button>
            <button data-value="2" class="calculator__button--number">2</button>
            <button data-value="3" class="calculator__button--number">3</button>
            <button id="btn-add" class="calculator__button">+</button>
            <button id="btn-toggle-sign" class="calculator__button">+/-</button>
            <button data-value="0" class="calculator__button--number">0</button>
            <button id="btn-decimal" class="calculator__button">.</button>
            <button id="btn-result" class="calculator__button calculator__button--result">=</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
